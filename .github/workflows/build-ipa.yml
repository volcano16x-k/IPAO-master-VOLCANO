name: Build VOLCANO iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15  # يستخدم macOS مع إصدار Xcode الحديث

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Clean DerivedData
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project VOLCANO.xcodeproj \
            -scheme VOLCANO \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/VOLCANO.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=singlefile

      - name: Export Payload / IPA Structure
        run: |
          mkdir -p Payload
          cp -r build/VOLCANO.xcarchive/Products/Applications/*.app Payload/
          zip -r VOLCANO.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOLCANO-Unsigned-IPA
          path: VOLCANO.ipa
